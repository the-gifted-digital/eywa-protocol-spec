# Copy to <brand-repo>/.github/workflows/page-history.yml and replace <BRAND_ID> with the
# brand's slug (e.g. vth-biodent). Belongs in the BRAND repo, not in eywa-protocol-spec.
# Prerequisite: repository secret SUPABASE_SERVICE_KEY in this repo (GTGT service key).
# eywa-protocol-spec is public, so no extra token is needed; see scripts/page-history/README.md
# for what changes if it is ever made private.
# To stop crawling: delete this file.
name: page-history

on:
  schedule:
    - cron: '0 19 * * *' # 02:00 Bangkok
  workflow_dispatch:

jobs:
  page-history:
    # Pinned release. Bump BOTH the @tag and spec_ref together (the tag selects the workflow file,
    # spec_ref selects the crawler code it checks out).
    uses: the-gifted-digital/eywa-protocol-spec/.github/workflows/page-history.yml@page-history-v1
    with:
      brand_id: <BRAND_ID>
      spec_ref: page-history-v1
    secrets: inherit
